name: verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sample/go.mod
          cache: false
      - run: bash scripts/tools.sh
      - run: echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - run: make setup test lint audit
      - run: PYTHONPATH=. .venv/bin/python scripts/regressions.py
      - run: cd sample && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make cluster images
      - run: make integration
      - if: always()
        run: |
          if test -f .local/kubeconfig; then
            .local/bin/kubectl --kubeconfig .local/kubeconfig --context kind-releaseguard --namespace releaseguard-demo get pods
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-incident-reports
          include-hidden-files: true
          path: |
            .local/integration/*.json
            .local/regressions/*.txt
          if-no-files-found: ignore
