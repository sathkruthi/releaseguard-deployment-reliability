apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-dependency
  namespace: releaseguard-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: releaseguard-dependency}
  template:
    metadata:
      labels: {app: releaseguard-dependency}
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: dependency
          image: releaseguard-sample:v1
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: dependency}
            - {name: DEPENDENCY_FAIL, value: "0"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 1
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-dependency
  namespace: releaseguard-demo
spec:
  type: NodePort
  selector: {app: releaseguard-dependency}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: releaseguard-prometheus
  namespace: releaseguard-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s
    scrape_configs:
      - job_name: releaseguard
        dns_sd_configs:
          - names: [releaseguard-demo-metrics.releaseguard-demo.svc.cluster.local]
            type: A
            port: 8080
            refresh_interval: 1s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-prometheus
  namespace: releaseguard-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: releaseguard-prometheus}
  template:
    metadata:
      labels: {app: releaseguard-prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          imagePullPolicy: Never
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=1h]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 1
            timeoutSeconds: 1
      volumes:
        - name: config
          configMap: {name: releaseguard-prometheus}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-prometheus
  namespace: releaseguard-demo
spec:
  type: NodePort
  selector: {app: releaseguard-prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30090}]
