---
# Source: releaseguard-sample/templates/app.yaml
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-demo
  namespace: releaseguard-demo
spec:
  type: NodePort
  selector: {app: releaseguard-sample}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

---
# Source: releaseguard-sample/templates/app.yaml
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-demo-metrics
  namespace: releaseguard-demo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: releaseguard-sample}
  ports:
    - port: 8080
      targetPort: 8080

---
# Source: releaseguard-sample/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-demo
  namespace: releaseguard-demo
spec:
  replicas: 1
  progressDeadlineSeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: releaseguard-sample
  template:
    metadata:
      labels:
        app: releaseguard-sample
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3
      containers:
        - name: app
          image: releaseguard-sample:v1
          imagePullPolicy: Never
          env:
            - name: ROLE
              value: app
            - name: DEPENDENCY_URL
              value: http://releaseguard-dependency:8080/check
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
